name: Node.js CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      deploy_tests:
        description: 'Run integration tests?'
        required: false
        default: true
        type: boolean

jobs:
  ci:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: echo "ci is done"

      - name: Run ESLint
 run: npm run lint

      - name: Check formatting
        run: npm run format:check

   name: Run tests
        run: npm run test:ci

      - name: Build application
        run: npm run build
